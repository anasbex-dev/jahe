[package]
name = "jahe"
version = "0.7.0"
edition = "2021"
description = "Bootstrap frontend for the JAHE programming language"
license = "MIT"

[dependencies]
cranelift-codegen = "0.137.2"
cranelift-frontend = "0.137.2"
cranelift-module = "0.137.2"
cranelift-object = "0.137.2"
cranelift-native = "0.137.2"
jahe-runtime = { path = "../runtime" }

[lib]
name = "jahe_compiler"
path = "src/lib.rs"

[[bin]]
name = "jahe"
path = "src/main.rs"
